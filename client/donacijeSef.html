<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="sef">
    <main>
        <div class="container-fluid pt-4 px-4">

            <!-- Izvršene donacije -->
            <h1 class="text-center mb-4">Izvršene donacije</h1>

            <div class="row g-4">

                <!-- Donacije hrane - zbog ID-ja ovde ucitavam jer svi ostali koriste bez  -->
                <div class="col-12 col-xl-6">
                    <div class="bg-light rounded h-100 p-4">
                        <h6 class="mb-4 text-center">Donacije hrane</h6>

                        <button id="dodajDonacijuHBtn"
                                class="btn btn-primary mb-4"
                                onclick="openFormDonH()">
                            Dodaj donaciju
                        </button>

                        <div class="table-responsive">
                            <table class="table table-bordered" id="donacije-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Datum</th>
                                        <th>Donator</th>
                                        <th>Grad</th>
                                    </tr>
                                </thead>
                                <tbody id="donacije-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Novčane donacije -->
                <div class="col-12 col-xl-6">
                    <div id="tabela-novcane-donacije"></div>
                        <div class="d-flex justify-content-center mt-3">
                            <button id="dodajDonacijuNBtn"
                            class="btn btn-primary"
                            onclick="openFormDonN()">
                            Dodaj novčanu donaciju
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Brisanje donacije -->
                <div class="row g-4 mt-2 justify-content-center">
                    <div class="col-12 col-md-10 col-xl-8">
                        <div class="bg-light rounded p-4">
                            <h5 class="mb-3 text-center">Obriši donaciju</h5>

                            <form id="forma-obrisi" action="/deleteDonaciju" method="POST">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control"
                                        name="Id" placeholder="ID" required>
                                    <label>ID donacije</label>
                                </div>

                                <button type="submit" class="btn btn-danger py-3 w-100">
                                    Obriši
                                </button>
                                    <span id="poruka-obrisi" class="d-block mt-3 text-center"></span>
                            </form>
                        </div>
                    </div>
                </div>

            <!-- Tekuće donacije -->
            <div class="mt-4">
                <h1 class="text-center mb-4">Tekuće donacije</h1>

                <div class="bg-light rounded p-4">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="tekDonSef-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Datum i vreme</th>
                                    <th>Opis</th>
                                    <th>Grad</th>
                                    <th>Adresa preuzеća</th>
                                    <th>Donator ID</th>
                                    <th>Prevoznik ID</th>
                                    <th>Kuhinja ID</th>
                                </tr>
                            </thead>
                            <tbody id="tekDonSef-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Odbijanje donacije -->
            <div class="row g-4 mt-2 justify-content-center">
                <div class="col-12 col-md-10 col-xl-8">
                    <div class="bg-light rounded p-4">
                        <h5 class="mb-3 text-center">Odbij donaciju</h5>

                        <form id="forma-odbij" action="/odbiDonaciju" method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"
                                    name="Id" placeholder="ID" required>
                                <label>ID donacije</label>
                            </div>

                            <button type="submit" class="btn btn-danger py-3 w-100">
                                Odbij
                            </button>
                            <span id="poruka-odbij" class="d-block mt-3 text-center"></span>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluNovcaneDonacije.js"></script>
    <script src="js/ucitajTekuceDonacije.js"></script>
    <script src="js/formeDonacija.js"></script>
    <script src="js/ucitajDonacijeSef.js"></script>
    <script src="js/brisanjeIOdbijanjeDonacije.js"></script>

</body>
</html>

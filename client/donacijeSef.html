<body data-role="sef">
    <main>

                <table class="table table-bordered" id="donacije-table">
                    <thead>
                        <tr>
                            <!--<th scope="col">#</th>-->

                    <button id="dodajDonacijuHBtn" class="btn btn-primary mb-4"onclick="openFormDonH()">Dodaj donaciju</button>

                    <tbody id="donacije-body">
                        <!-- Podaci će biti dinamički ubačeni ovde -->

                </table>

            </div>

        <!--novcane donacije-->

                <h6 class="mb-4 text-center">Novčane donacije</h6>
                <div class="d-flex justify-content-center">
                <div class="dropdown">
                    <button class="btn btn-primary mb-4 dropdown-toggle" data-bs-toggle="dropdown" >Sortiraj</button>

                    </ul>
                   <button id="dodajDonacijuNBtn" class="btn btn-primary mb-4"onclick="openFormDonN()">Dodaj donaciju</button>

                </div>
                </div>
                <table class="table table-bordered" id="donacijeN-table">
                    <thead>
                        <tr>
                            <!--<th scope="col">#</th>-->

                            <th scope="col">Datum</th>
                            <th scope="col" >Ime</th>
                            <th scope="col">Iznos</th>

                    </thead>
                    <tbody id="donacijeN-body">

        <!---->

        <div class="container-fluid pt-4 px-4">

            <label >ID donacije</label>
        </div>
        <button type="submit" class="btn btn-danger py-3 w-100">Obriši</button>
        </form></div>

        <div class="container-fluid pt-4 px-4">
            <h1 class="text-center mb-4">Tekuće donacije</h1>
            <div class="row g-4">
        <div class="col-sm-12 "><!--col-xl-6-->
            <div class="bg-light rounded h-100 p-4">
                <table class="table table-bordered" id="tekDonSef-table">
                    <thead>
                        <tr>
                            <!--<th scope="col">#</th>-->
                            <th scope="col">ID</th>
                            <th scope="col">Datum i vreme</th>
                            <th scope="col">Opis</th>
                            <th scope="col">Grad</th>

            </div>
        </div>

        <div class="container-fluid pt-4 px-4">
            <h5 class="mb-3 text-center">Odbi donaciju</h5>
             <form action="/odbiDonaciju" method="POST">
           <div class="form-floating mb-3">
             <input type="text" class="form-control"  name="Id" placeholder="ID" required>
            <label >ID donacije</label>
        </div>
        <button type="submit" class="btn btn-danger py-3 w-100">Odbi</button>

    </main>

    <script src="js/layout.js"></script>

    <script>
        // JavaScript za dohvatanje podataka i ažuriranje tabele za donacije koje su izvrsene
        window.addEventListener('load', function() {
            fetch('/donacije') // Dohvat podataka sa servera
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('donacije-body');
                    data.forEach(donacija => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${donacija.ID||''}</td>
                            <td>${donacija.Datum||''}</td>
                            <td>${donacija.Donator||''}</td>
                            <td>${donacija.Podrucje||''}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
        });
    </script>

    <script>
        function openFormDonN() {
            window.location.href = 'formaZaDonacijuN.html';
        }
        function openFormDonH() {
            window.location.href = 'formaZaDonacijuH.html';
        }
    </script>

    <script>
        // JavaScript za dohvatanje podataka i ažuriranje tabele
        window.addEventListener('load', function() {
            var sortTypeInput = document.querySelector('input[name="sort-type"]:checked');
            var sortType ='Datum'; // Default vrednost ako nijedno dugme nije izabrano

            if (sortTypeInput && sortTypeInput.value === 'Iznos') {
                sortType = 'Iznos';
            }

            var url = (sortType === 'Iznos') ? '/donacijeNSort' : '/donacijeN';

            fetch(url) // Dohvat podataka sa servera
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('donacijeN-body');
                    const limit = 50; // Limit za broj redova koje prikazujemo
                    data.slice(0, limit).forEach(donacija => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${donacija.Datum||''}</td>
                            <td>${donacija.Ime||''}</td>
                            <td>${donacija.Iznos||''}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
        });

        function sortTable() {
                var sortTypeInput = document.querySelector('input[name="sort-type"]:checked');
                var sortType = sortTypeInput.value;

                var url = (sortType === 'Iznos') ? '/donacijeNSort' : '/donacijeN';

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        const tableBody = document.getElementById('donacijeN-body');
                        tableBody.innerHTML = ''; 
                        const limit = 50; // Limit za broj redova koje prikazujemo
                        data.slice(0, limit).forEach(donacija => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${donacija.Datum||''}</td>
                                <td>${donacija.Ime||''}</td>
                                <td>${donacija.Iznos||''}</td>
                            `;
                            tableBody.appendChild(row);
                        });
                    })
                    .catch(error => console.error('Greška pri dohvatanju podataka:', error));
            }
    </script>

    <script>

        window.addEventListener('load', function() {
            fetch('/tekDonSef') 
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('tekDonSef-body');
                    data.forEach(donacija => {
                        const row = document.createElement('tr');
                        let formatiranDatum = '';
                        if (donacija.Datum != null) {
                            const datum = new Date(donacija.Datum);
                            const minuti = ("0" + datum.getMinutes()).slice(-2);
                            formatiranDatum = `${datum.getDate()}/${datum.getMonth() + 1}/${datum.getFullYear()} ${datum.getHours()}:${minuti}`;
                    }
                        row.innerHTML = `
                            <td>${donacija.ID || ''}</td>
                            <td>${formatiranDatum || ''}</td>
                            <td>${donacija.Opis || ''}</td>
                            <td>${donacija.Podrucje || ''}</td>
                            <td>${donacija.AdresaPreuzeca || ''}</td>
                            <td>${donacija.DNTRID || ''}</td>
                            <td contenteditable="true" onblur="updateDonacija(${donacija.ID}, 'PID', this.innerText)">${donacija.PID || ''}</td>
                            <td contenteditable="true" onblur="updateDonacija(${donacija.ID}, 'KID', this.innerText)">${donacija.KID || ''}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
        });

        function updateDonacija(id, field, value) {
            fetch('/updatetekDonSef', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id, field: field, value: value })
            })
            .then(response => {
                if (response.ok) {
                    alert('Donacija je uspešno ažurirana.');
                    location.reload();
                } else {
                    alert('Greška pri ažuriranju donacije.');
                }
            })
            .catch(error => {
                console.error('Greška pri ažuriranju donacije:', error);
                alert('Greška pri ažuriranju donacije.');
            });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="sr">

<!-- KUHINJA DOBRODOSLI -->

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="kuhinja">

    <main>
        <div class="container-fluid pt-4 px-4">

            <!-- Prve dve tabele -->
            <div class="row g-4 align-items-stretch">

                <div class="col-md-6 d-flex">
                    <div id="tabela-donacije" class="w-100"></div>
                </div>

                <div class="col-md-6 d-flex">
                    <div id="tabela-novcane-donacije"class="w-100"></div>
                </div>

            </div>

            <!-- Donacije za kuhinju -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="bg-light rounded p-4">

                        <h6 class="mb-4 text-center">
                            Donacije za vašu kuhinju
                        </h6>

                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Datum i vreme</th>
                                        <th>Opis</th>
                                        <th>ID donatora</th>
                                        <th>Akcija</th>
                                    </tr>
                                </thead>

                                <tbody id="donKuh-body">
                                    <!-- Podaci se učitavaju iz JavaScripta -->
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluDonacije.js"></script>
    <script src="js/ucitajTabeluNovcaneDonacije.js"></script>
    <script src="js/ucitajDonacijeKuhinje.js"></script>

</body>
</html>

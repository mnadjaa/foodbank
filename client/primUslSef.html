<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="sef" data-add-href="signupPU.html" data-add-text="Dodaj korisnika">
    <main>
        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
                <!--krajnji korisnici tabela-->
                <div class="bg-light rounded h-100 p-4">
                    <h6 class="mb-4 text-center">Krajnji Korisnici</h6>
                    <div id="korisnici-tabela-container"></div>
                </div>

                <!--brisanje krajnjeg korisnika-->
                <div class="container-fluid pt-4 px-4">
                <h5 class="mb-3 text-center">Obriši korisnika</h5>
                <form action="/deletePU" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="deleteUserId" name="Id" placeholder="ID" required>
                        <label >ID korisnika</label>
                    </div>
                    <button type="submit" class="btn btn-danger py-3 w-100">Obriši</button>
                </form>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluKorisnici.js"></script>
</body>
</html>

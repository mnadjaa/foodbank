<!DOCTYPE html>
<html lang="sr">

<!--REGISTRUJ SE-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
    <script src="login.js" defer></script>
</head>

<body data-layout="auth">
    <main>
        <!-- Sign Up Start -->
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h3>Registruj se</h3>
                        </div>
                        <form action="/signup" method="POST">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="suuser" name="usernameSef"placeholder="jhondoe">
                            <label for="suuser">Korisničko ime</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="suemail" name="emailSef"placeholder="name@example.com">
                            <label for="suemail">Email adresa</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="suuser" name="podrucjeSef"placeholder="jhondoe">
                            <label for="suuser">Podrucje</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="supassword"name="passwordSef" placeholder="Password">
                            <label for="supassword">Šifra</label>
                        </div>
                        <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Registruj se</button>
                    </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Sign Up End -->
    </main>

    <script src="js/layout.js"></script>
</body>

</html>

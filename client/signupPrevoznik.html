<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-layout="auth">
    <main>
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h3>Podaci o prevozniku</h3>
                        </div>
                        <form id="signupForm">                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="ime"placeholder="jhondoe" required>
                                <label for="suuser">Ime</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="prezime"placeholder="jhondoe">
                                <label for="suuser">Prezime</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="suemail" name="email"placeholder="name@example.com" required>
                                <label for="suemail">Email adresa</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="telefon"placeholder="jhondoe" required>
                                <label for="suuser">Telefon</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="vozilo"placeholder="jhondoe">
                                <label for="suuser">Tip vozila</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="podrucje"placeholder="jhondoe"required>
                                <label for="suuser">Područje</label>
                                <span class="error-message"></span>

                            </div>
                            <span id="formaGreska" class="text-danger d-block mb-3"></span>
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Dodaj prevoznika</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const greska = document.getElementById('formaGreska');
        greska.textContent = '';

        const podaci = Object.fromEntries(new FormData(e.target));

        try {
            const response = await fetch('/signupPrevoznik', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(podaci)
            });

            const tekst = await response.text();
            let data = {};
            try { data = JSON.parse(tekst); } catch (_) {}

            if (response.ok && data.success !== false) {
                alert(data.message || 'Prevoznik je uspešno dodat.');
                window.location.replace('prevozniciSef.html');
            } else {
                greska.textContent = data.message || 'Greška pri dodavanju (status ' + response.status + ').';
            }
        } catch (err) {
            console.error(err);
            greska.textContent = 'Greška u komunikaciji sa serverom.';
        }
    });
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="sr">

<!--KUHINJE DONATOR LICNO-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="donator">
    <main>
        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
            <h6 class="mb-4 mt-4 text-center">Kuhinje</h6>
                <table class="table table-bordered" id="donacije-table">
                    <thead>
                        <tr>
                        <!--<th scope="col">#</th>-->
                        <th scope="col"></th>
                        <th scope="col">Naziv</th>
                        <th scope="col">Grad</th>
                        <th scope="col">Adresa</th>
                        <th scope="col">Broj obroka</th>
                    </tr>
                    </thead>
                    <tbody id="kuhinje-body">
                    <!-- Podaci će biti dinamički ubačeni ovde -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/kuhinje')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('kuhinje-body');
                    tableBody.innerHTML = ''; // Clear any existing rows
                    data.forEach((row, index) => {
                        const tableRow = document.createElement('tr');
                        tableRow.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.Naziv||''}</td>
                            <td>${row.Podrucje||''}</td>
                            <td>${row.Adresa||''}</td>
                            <td>${row.Stanje||''}</td>
                        `;
                        tableBody.appendChild(tableRow);
                    });
                })
                .catch(error => console.error('Error fetching kuhinje:', error));
        });
    </script>
</body>

</html>

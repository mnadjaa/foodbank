<body>
    <div class="container-xxl position-relative bg-white d-flex p-0">
        <!-- Spinner Start -->
        <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
        <!-- Spinner End -->


        <!-- Sidebar Start -->
        <div class="sidebar pe-4 pb-3">
            <nav class="navbar bg-light navbar-light">
                <a href="index.html" class="navbar-brand mx-4 mb-3">
                    <h3 class="text-primary"><i class="fa fa-hashtag me-2"></i>OZS</h3>
                </a>
                <div class="navbar-nav w-100">
                    <a href="donator.html" class="nav-item nav-link"><i class="fa fa-check me-2"></i>Dobrodošli</a>
                    <a href="donirajDonator.html" class="nav-item nav-link"><i class="fa fa-donate me-2"></i>Doniraj</a>
                     <a href="donacijeDonator.html" class="nav-item nav-link"><i class="fa fa-table me-2"></i>Donacije</a>
                     <a href="kuhinjeDonator.html" class="nav-item nav-link active"><i class="fa fa-coffee me-2"></i></i>Kuhinja</a>
                     <a href="donatoriDonator.html" class="nav-item nav-link"><i class="fa fa-list-ul me-2"></i>Donatori</a>
                    </div>
            </nav>
        </div>
        <!-- Sidebar End -->


        <!-- Content Start -->
        <div class="content">
            <!-- Navbar Start -->
            <nav class="navbar navbar-expand bg-light navbar-light sticky-top px-4 py-0">
                <a href="index.html" class="navbar-brand d-flex d-lg-none me-4">
                    <h2 class="text-primary mb-0"><i class="fa fa-hashtag"></i></h2>
                </a>
                <a href="#" class="sidebar-toggler flex-shrink-0">
                    <i class="fa fa-bars"></i>
                </a>
            </nav>
            <!-- Navbar End -->

            <div class="container-fluid pt-4 px-4">
                <div class="row g-4">
                <h6 class="mb-4 mt-4 text-center">Kuhinje</h6>
                    <table class="table table-bordered" id="donacije-table">
                        <thead>
                            <tr>
                            <!--<th scope="col">#</th>-->
                            <th scope="col"></th>
                            <th scope="col">Naziv</th>
                            <th scope="col">Grad</th>
                            <th scope="col">Adresa</th>
                            <th scope="col">Broj obroka</th>
                        </tr>
                        </thead>
                        <tbody id="kuhinje-body">
                        <!-- Podaci će biti dinamički ubačeni ovde -->
                        </tbody>
                    </table>
                </div>
            </div>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/kuhinje')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('kuhinje-body');
                    tableBody.innerHTML = ''; // Clear any existing rows
                    data.forEach((row, index) => {
                        const tableRow = document.createElement('tr');
                        tableRow.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.Naziv||''}</td>
                            <td>${row.Podrucje||''}</td>
                            <td>${row.Adresa||''}</td>
                            <td>${row.Stanje||''}</td>
                        `;
                        tableBody.appendChild(tableRow);
                    });
                })
                .catch(error => console.error('Error fetching kuhinje:', error));
        });
    </script>


            <!-- Footer Start -->
            <div class="container-fluid pt-4 px-4">
                <div class="bg-light rounded-top p-4">

                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer End -->
        </div>
        <!-- Content End -->


        <!-- Back to Top -->
        <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
    </div>

    <script src="lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>

</html>

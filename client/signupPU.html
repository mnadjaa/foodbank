<!DOCTYPE html>
<html lang="sr">

<!--REGISTRUJ SE-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
    <script src="index.js" defer></script>
    <script src="login.js" defer></script>
</head>

<body data-layout="auth">
    <main>
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h3>Podaci o krajnjem korisniku</h3>
                        </div>
                        <form action="/signupPU" method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="ime"placeholder="jhondoe">
                                <label for="suuser">Ime</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="prezime"placeholder="jhondoe">
                                <label for="suuser">Prezime</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="podrucje"placeholder=""required>
                                <label for="suuser">Područje</label>
                                <span class="error-message"></span>

                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"  name="brojBonova"placeholder="">
                                <label for="suuser">Broj bonova</label>
                            </div>
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Dodaj korisnika</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
</body>

</html>

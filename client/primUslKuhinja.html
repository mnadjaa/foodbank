<script>

    let trenutniGrad='svi';

    function popunjavanjeTabele(data){
    const tableBody = document.getElementById('korisnici-body');
    tableBody.innerHTML='';
    data.forEach(k => {
    const row = document.createElement('tr');
    row.id = `red_${k.PUID}`;
    row.innerHTML = `
            <td>${k.PUID}</td>     <!--iz baze-->
            <td>${k.Podrucje||''}</td>
            <td>${k.Ime}</td>
            <td>${k.Prezime||''}</td>
            <td class="broj-bonova" >${k.BrojBonova || ''}</td>
            <td class="text-center">
                <div class="input-group">
                    <input type="text" class="form-control" id="noviBrojBonova_${k.PUID}" pattern="\d*" inputmode="numeric" min="0" placeholder="Koliko bonova skidate">
                    <button onclick="promBrBonova('${k.PUID}', '${k.BrojBonova}')" class="btn btn-primary">Promeni broj bonova</button>
                </div>
            </td>

             `;
            tableBody.appendChild(row);
        });
    }

    function promBrBonova(puid,trenutniBrojBonova) {
        const noviBrojBonova = document.getElementById(`noviBrojBonova_${puid}`).value;


    // Provera da li je unet validan broj
        if (!noviBrojBonova || isNaN(noviBrojBonova)||noviBrojBonova<0) {
            alert('Unesite validan broj bonova koji nije negativan');
            return;
        }

        if (trenutniBrojBonova === null || isNaN(trenutniBrojBonova)) {
            alert('Trenutni broj bonova korisnika je nepoznat');
            return;
        }

        if (parseInt(noviBrojBonova) > trenutniBrojBonova) {
            alert('Ne možete oduzeti više bonova nego što korisnik ima');
            return;
        }


    // AJAX poziv ka serverskoj ruti za promenu broja bonova
    fetch(`/promeniBrBonova`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ puid: puid, brojBonova: noviBrojBonova })
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Greska pri dobijanju odgovora od servera');
        }
        return response.json();
    })
    .then(data => {
        console.log('Promena broja bonova uspešno izvršena:', data);
        filtriranjePoGradu(trenutniGrad);

    })
    .catch(error => {
        console.error('Greška pri promeni broja bonova:', error);
    });
}


            
            function filtriranjePoGradu(grad){
                trenutniGrad=grad;
                fetch('/korisnici') // Dohvatamo podataka sa servera 
            .then(response => response.json())
            .then(data => {
                const filtriraniPodaci = grad === 'svi' ? data : data.filter(k => k.Podrucje === grad);
                popunjavanjeTabele(filtriraniPodaci);
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
    } 
    
    window.addEventListener('load', function() {
        filtriranjePoGradu('svi');

});


    window.addEventListener('DOMContentLoaded', function() {
        const gradoviDropdown = document.getElementById('gradDropdown');
        const dropdownMenu = document.querySelector('.dropdown-menu');

        gradoviDropdown.addEventListener('click', function(event) {
            dropdownMenu.classList.toggle('show');
        });

        // Zatvaranje padajuceg menija ako se klikne van njega
        window.addEventListener('click', function(event) {
            if (!gradoviDropdown.contains(event.target)) {
                dropdownMenu.classList.remove('show');
            }
        });

        // Dohvatanje jedinstvenih podataka iz baze
        gradoviDropdown.addEventListener('click', function() {
            fetch('/gradoviKorisnika')
                .then(response => response.json())
                .then(data => {
                    // Pravimo skup jedinstvenih gradova da nam se ne ponavljaju iste vrednosti
                    const jedinstveniGradovi = new Set(data);

                    // Uklonimo sve postojeće opcije pre nego što dodamo nove
                    dropdownMenu.innerHTML = '';


                    const sviLink = document.createElement('a');
            sviLink.classList.add('dropdown-item');
            sviLink.href = '#';
            sviLink.textContent = 'Svi gradovi';
            sviLink.onclick = function() {
                filtriranjePoGradu('svi');
            };
            dropdownMenu.appendChild(sviLink);


                    //dodajemo svaki grad u padajuci meni
                    jedinstveniGradovi.forEach(grad => {
                        const link = document.createElement('a');
                        link.classList.add('dropdown-item');
                        link.href = '#';
                        link.textContent = grad;
                        link.onclick = function() {
                            filtriranjePoGradu(grad);
                        };

                        dropdownMenu.appendChild(link);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju gradova iz baze:', error));
        });


});

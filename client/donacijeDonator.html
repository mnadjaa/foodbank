<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="donator">

    <main>
        <div class="container-fluid pt-4 px-4">

            <!-- Sve donacije -->
            <h1 class="text-center mb-4">Sve donacije</h1>

            <div class="row g-4 mb-4">
                <div class="col-md-6">
                    <div id="tabela-donacije"></div>
                </div>

                <div class="col-md-6">
                    <div id="tabela-novcane-donacije"></div>
                </div>
            </div>

            <!-- Vaše donacije -->
            <h1 class="text-center mb-4">Vaše donacije</h1>

            <div class="row g-4">

                <!-- Izvršene donacije -->
                <div class="col-12">
                    <div class="bg-light rounded h-100 p-4">
                        <h6 class="mb-4 text-center">Izvršene donacije</h6>

                        <div class="table-responsive">
                            <table class="table table-bordered" id="vasedonacije-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Datum</th>
                                        <th>Opis</th>
                                        <th>Grad</th>
                                    </tr>
                                </thead>
                                <tbody id="vasedonacije-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Donacije u toku -->
                <div class="col-12">
                    <div class="bg-light rounded h-100 p-4">
                        <h6 class="mb-4 text-center">Donacije u toku</h6>

                        <div class="table-responsive">
                            <table class="table table-bordered" id="vaseNeizvdon-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Datum</th>
                                        <th>Opis</th>
                                        <th>Grad</th>
                                    </tr>
                                </thead>
                                <tbody id="vaseNeizvdon-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Odbijene donacije -->
                <div class="col-12">
                    <div class="bg-light rounded h-100 p-4">
                        <h6 class="mb-4 text-center">Odbijene donacije</h6>

                        <div class="table-responsive">
                            <table class="table table-bordered" id="odbijenedon-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Datum</th>
                                        <th>Opis</th>
                                        <th>Grad</th>
                                    </tr>
                                </thead>
                                <tbody id="odbijenedon-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluDonacije.js"></script>
    <script src="js/ucitajTabeluNovcaneDonacije.js"></script>
    <script src="js/ucitajMojeDonacije.js"></script>

</body>
</html>

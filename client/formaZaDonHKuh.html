<!DOCTYPE html>
<html lang="sr">

<!--REGISTRUJ SE-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
    <script src="login.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body data-layout="auth">
    <main>
            <!-- Sign Up Start -->
            <div class="container-fluid">
                <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                    <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                        <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <h3>Podaci o donaciji</h3>
                            </div>
                   <form action="/dodajDonHKuh" method="POST">
        <div class="form-floating mb-3">
            <input  class="form-control" id="datumVreme" name="datumVreme" placeholder="Izaberite datum i vreme" required >
            <label for="datumVreme">Datum i vreme</label>
            <span class="error-message"></span>
        </div>

                            <div class="form-floating mb-3">
                                <input  class="form-control" name="opis" required>
                                <label >Opis</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input class="form-control" name="dntrid">
                                <label >ID donatora</label>
                            </div>    
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Dodaj donaciju</button>
                        </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Sign Up End -->
    </main>

    <script src="js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/datumVreme.js"></script>
    
</body>

</html>

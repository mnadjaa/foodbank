                            </div>
                            <form action="/doniraj" method="POST">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control"  name="opis"required>
                                    <label >Šta želite da donirate</label>
                                    <span class="error-message"></span>
                                </div>
                                <div class="form-floating mb-3">

                                    <span class="error-message"></span>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>


<script>
    flatpickr("#datumVreme", {
        enableTime: true, 
        dateFormat: "Y-m-d H:i", // Format datuma i vremena 
        time_24hr: true 
    });
</script>

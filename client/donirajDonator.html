<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body data-role="donator">
    <main>
        <div class="container-fluid pt-4 px-4">
            <div class="row justify-content-center">
                <div class="col">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-center mb-3">
                            <h3 style="text-align: center;">Nova donacija</h3>
                        </div>
                        <form action="/doniraj" method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"  name="opis"required>
                                <label >Šta želite da donirate</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="adresaPreuzeca"required>
                                <label>Adresa preuzeća</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="grad"required>
                                <label>Grad</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"  name="telefon"required>
                                <label >Telefon</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="datumVreme" name="datumVreme" placeholder="Izaberite datum i vreme" required >
                                <label for="datumVreme">Datum i vreme</label>
                                <span class="error-message"></span>
                            </div>
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Doniraj</button>
                        </form>
                    </div>
                </div>
            </div>    
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/datumVreme.js"></script>
   
</body>

</html>

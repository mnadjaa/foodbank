<!DOCTYPE html>
<html lang="sr">

<!--PREVOZNICI SEF-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="sef" data-add-href="signupPrevoznik.html" data-add-text="Dodaj prevoznika">
    <main>
                    <!-- Form Start -->
                    <div class="container-fluid pt-4 px-4">
                        <div class="row g-4">
                            <!--prevoznici-->
                            <div class="bg-light rounded h-100 p-4">
                                <h6 class="mb-4">Prevoznici</h6>
                                <table class="table table-bordered" id="prevoznici-table">
                                   <thead>
                                       <tr>
                                           <!--<th scope="col">#</th>-->
                                           <th scope="col">Id</th>
                                           <th scope="col">
                                               <div class="dropdown" style="display: inline;">
                                                   <button class="btn btn-secondary dropdown-toggle dropdown-toggle-split" type="button" id="gradDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                                       Grad
                                                   </button>
                                                   <div class="dropdown-menu" aria-labelledby="gradDropdown">
                                                       <a class="dropdown-item" href="#" onclick="filtriranjePoGradu('svi')">Svi gradovi</a>
                                                       <!-- Dodajte JavaScript kod da se generišu opcije iz baze podataka -->
                                                   </div>
                                               </div>
                                           </th>
                                           </th>
                                           <th scope="col">Ime</th>
                                           <th scope="col">Prezime</th>
                                           <th scope="col">Telefon</th>
                                           <th scope="col">Mejl</th>
                                           <th scope="col">Vozilo</th>
                                       </tr>
                                   </thead>
                                   <tbody id="prevoznici-body">
                                       <!-- Podaci će biti dinamički ubačeni ovde -->
                                   </tbody>
                               </table>
                            </div>
                            <!--prevoznici-->

                            <!--raspored-->
                            <div class="bg-light rounded h-100 p-4">
                                <h6 class="mb-4">Raspored</h6>
                               <table class="table table-bordered" id="resporedp-table">
                                   <thead>
                                       <tr>
                                           <!--<th scope="col">#</th>-->
                                           <th scope="col">Id</th>
                                           <th scope="col">Grad</th>
                                           <th scope="col">Adresa preuzeća</th>
                                           <th scope="col">Datum i vreme</th>
                                           <th scope="col">Opis donacije</th>
                                       </tr>
                                   </thead>
                                   <tbody id="rasporedp-body">
                                       <!-- Podaci će biti dinamički ubačeni ovde -->
                                   </tbody>
                               </table>
                            </div>
                            <!--raspored-->

                            <!--obrisi prevoznika-->
                            <div class="container-fluid pt-4 px-4">
                                <h5 class="mb-3 text-center">Obriši prevoznika</h5>
                               <form action="/deletePrevoznik" method="POST">
                                    <div class="form-floating mb-3">
                                       <input type="text" class="form-control" id="deleteUserId" name="Id" placeholder="ID" required>
                                       <label >ID prevoznika</label>
                                    </div>
                                   <button type="submit" class="btn btn-danger py-3 w-100">Obriši</button>
                                </form>
                            </div>
                            <!--obrisi prevoznika-->

                        </div>
                    </div>
                    <!-- Form End -->

        <!--tabela-->

                     <!-- brisanje prevoznika -->
    </main>

    <script src="js/layout.js"></script>

    <script>
            // JavaScript za dohvatanje podataka i ažuriranje tabele

                        function popunjavanjeTabele(data){
                        const tableBody = document.getElementById('prevoznici-body');
                        tableBody.innerHTML='';
                        data.forEach(prevoznik => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${prevoznik.PID}</td>     <!--iz baze-->
                                <td>${prevoznik.Podrucje}</td>
                                <td>${prevoznik.Ime}</td>
                                <td>${prevoznik.Prezime}</td>
                                <td>${prevoznik.Telefon}</td>
                                <td>${prevoznik.Mejl}</td>
                                <td>${prevoznik.Vozilo}</td>
                            `;
                            tableBody.appendChild(row);
                        });
                    }

                    function filtriranjePoGradu(grad){
                        fetch('/prevoznici') // Dohvat podataka sa servera /prevoznici?
                    .then(response => response.json())
                    .then(data => {
                        const filtriraniPodaci = grad === 'svi' ? data : data.filter(prevoznik => prevoznik.Podrucje === grad);
                        popunjavanjeTabele(filtriraniPodaci);
                        })
                        .catch(error => console.error('Greška pri dohvatanju podataka:', error));
            } 

            window.addEventListener('load', function() {
                filtriranjePoGradu('svi');

        });

            window.addEventListener('DOMContentLoaded', function() {
                const gradoviDropdown = document.getElementById('gradDropdown');
                const dropdownMenu = document.querySelector('.dropdown-menu');

                gradoviDropdown.addEventListener('click', function(event) {
                    dropdownMenu.classList.toggle('show');
                });

                // Zatvaranje padajuceg menija ako se klikne van njega
                window.addEventListener('click', function(event) {
                    if (!gradoviDropdown.contains(event.target)) {
                        dropdownMenu.classList.remove('show');
                    }
                });

                // Dohvatanje jedinstvenih podataka iz baze
                gradoviDropdown.addEventListener('click', function() {
                    fetch('/gradovi')
                        .then(response => response.json())
                        .then(data => {
                            // Pravimo skup jedinstvenih gradova
                            const jedinstveniGradovi = new Set(data);

                            // Uklonimo sve postojeće opcije pre nego što dodamo nove
                            dropdownMenu.innerHTML = '';

                            const sviLink = document.createElement('a');
                    sviLink.classList.add('dropdown-item');
                    sviLink.href = '#';
                    sviLink.textContent = 'Svi gradovi';
                    sviLink.onclick = function() {
                        filtriranjePoGradu('svi');
                    };
                    dropdownMenu.appendChild(sviLink);

                            //dodajemo svaki grad u padajuci meni
                            jedinstveniGradovi.forEach(grad => {
                                const link = document.createElement('a');
                                link.classList.add('dropdown-item');
                                link.href = '#';
                                link.textContent = grad;
                                link.onclick = function() {
                                    filtriranjePoGradu(grad);
                                };

                                dropdownMenu.appendChild(link);
                            });
                        })
                        .catch(error => console.error('Greška pri dohvatanju gradova iz baze:', error));
                });

        });
    </script>

    <script>
        window.addEventListener('load', function() {
            fetch('/rasporedp') // Dohvat podataka sa servera
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('rasporedp-body');
                    data.forEach(p => {
                        let formatiranDatum = '';
            if (p.Datum != null) {
                const datum = new Date(p.Datum);
                const minuti = ("0" + datum.getMinutes()).slice(-2);
                formatiranDatum = `${datum.getDate()}/${datum.getMonth() + 1}/${datum.getFullYear()} ${datum.getHours()}:${minuti}`;
        }
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${p.PID||''}</td>
                            <td>${p.Podrucje||''}</td>
                            <td>${p.AdresaPreuzeca || ''}</td>
                            <td>${formatiranDatum || ''}</td>
                            <td>${p.Opis || ''}</td>

                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
        });
    </script>
</body>

</html>

<script>
    // JavaScript za dohvatanje podataka i ažuriranje tabele
       
                function popunjavanjeTabele(data){
                const tableBody = document.getElementById('prevoznici-body');
                tableBody.innerHTML='';
                data.forEach(prevoznik => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${prevoznik.PID}</td>     <!--iz baze-->
                        <td>${prevoznik.Podrucje}</td>
                        <td>${prevoznik.Ime}</td>
                        <td>${prevoznik.Prezime}</td>
                        <td>${prevoznik.Telefon}</td>
                        <td>${prevoznik.Mejl}</td>
                        <td>${prevoznik.Vozilo}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            
            function filtriranjePoGradu(grad){
                fetch('/prevoznici') // Dohvat podataka sa servera /prevoznici?
            .then(response => response.json())
            .then(data => {
                const filtriraniPodaci = grad === 'svi' ? data : data.filter(prevoznik => prevoznik.Podrucje === grad);
                popunjavanjeTabele(filtriraniPodaci);
                })
                .catch(error => console.error('Greška pri dohvatanju podataka:', error));
    } 
    
    window.addEventListener('load', function() {
        filtriranjePoGradu('svi');

});


    window.addEventListener('DOMContentLoaded', function() {
        const gradoviDropdown = document.getElementById('gradDropdown');
        const dropdownMenu = document.querySelector('.dropdown-menu');

        gradoviDropdown.addEventListener('click', function(event) {
            dropdownMenu.classList.toggle('show');
        });

        // Zatvaranje padajuceg menija ako se klikne van njega
        window.addEventListener('click', function(event) {
            if (!gradoviDropdown.contains(event.target)) {
                dropdownMenu.classList.remove('show');
            }
        });

        // Dohvatanje jedinstvenih podataka iz baze
        gradoviDropdown.addEventListener('click', function() {
            fetch('/gradovi')
                .then(response => response.json())
                .then(data => {
                    // Pravimo skup jedinstvenih gradova
                    const jedinstveniGradovi = new Set(data);

                    // Uklonimo sve postojeće opcije pre nego što dodamo nove
                    dropdownMenu.innerHTML = '';


                    const sviLink = document.createElement('a');
            sviLink.classList.add('dropdown-item');
            sviLink.href = '#';
            sviLink.textContent = 'Svi gradovi';
            sviLink.onclick = function() {
                filtriranjePoGradu('svi');
            };
            dropdownMenu.appendChild(sviLink);


                    //dodajemo svaki grad u padajuci meni
                    jedinstveniGradovi.forEach(grad => {
                        const link = document.createElement('a');
                        link.classList.add('dropdown-item');
                        link.href = '#';
                        link.textContent = grad;
                        link.onclick = function() {
                            filtriranjePoGradu(grad);
                        };

                        dropdownMenu.appendChild(link);
                    });
                })
                .catch(error => console.error('Greška pri dohvatanju gradova iz baze:', error));
        });


});
</script>


            <script>
                window.addEventListener('load', function() {
                    fetch('/rasporedp') // Dohvat podataka sa servera
                        .then(response => response.json())
                        .then(data => {
                            const tableBody = document.getElementById('rasporedp-body');
                            data.forEach(p => {
                                let formatiranDatum = '';
                    if (p.Datum != null) {
                        const datum = new Date(p.Datum);
                        const minuti = ("0" + datum.getMinutes()).slice(-2);
                        formatiranDatum = `${datum.getDate()}/${datum.getMonth() + 1}/${datum.getFullYear()} ${datum.getHours()}:${minuti}`;
                }
                                const row = document.createElement('tr');
                                row.innerHTML = `
                                    <td>${p.PID||''}</td>
                                    <td>${p.Podrucje||''}</td>
                                    <td>${p.AdresaPreuzeca || ''}</td>
                                    <td>${formatiranDatum || ''}</td>
                                    <td>${p.Opis || ''}</td>

                                `;
                                tableBody.appendChild(row);
                            });
                        })
                        .catch(error => console.error('Greška pri dohvatanju podataka:', error));
                });
            </script>

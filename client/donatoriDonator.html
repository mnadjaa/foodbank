<!DOCTYPE html>
<html lang="sr">

<!--DONATORI DONATOR LICNO-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="donator">
    <main>
        <!-- donatori Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
                <h6 class="mb-3 mt-5 ">Donatori</h6>
                    <div class="table-responsive">
                        <table class="table table-bordered " id="donatori-table"style="width: fit-content;">
                            <thead>
                                <tr>
                                <!--<th scope="col">#</th>-->
                                <th scope="col"></th>
                                <th scope="col">Ime</th>
                                </tr>
                            </thead>
                            <tbody id="donatori-body">
                            <!-- Podaci će biti dinamički ubačeni ovde -->
                            </tbody>
                        </table>
                    </div>
            </div>
        </div>
        <!-- donatori End -->
    </main>

    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/donatori')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('donatori-body');
                    tableBody.innerHTML = ''; // da obrise redove koji postoje
                    data.forEach((row, index) => {
                        const tableRow = document.createElement('tr');
                        tableRow.innerHTML = `
                            <td>${index + 1}</td>
                            <td>${row.Naziv||''}</td>
                        `;
                        tableBody.appendChild(tableRow);
                    });
                })
                .catch(error => console.error('Error fetching donatori:', error));
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
    <script src="login.js" defer></script>
</head>

<body data-layout="auth">
    <main>
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h3>Podaci o kuhinji</h3>
                        </div>
                        <form id="signupForm">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="suuser" name="usernameKuhinja" placeholder="jhondoe" required>
                                <label for="suuser">Korisničko ime</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="podrucjeKuhinja" placeholder="" required>
                                <label>Podrucje</label>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control"  name="nazivKuhinja" placeholder="jhondoe" required>
                                <label >Naziv</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="adresaKuhinja" placeholder="" required>
                                <label>Adresa</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" name="idSefaKuhinja" placeholder="" required>
                                <label>ID sefa</label>
                            </div>
                            <div class="form-floating mb-4">
                                <input type="password" class="form-control" id="supassword" name="passwordKuhinja" placeholder="Password" required>
                                <label for="supassword">Šifra</label>
                                <span class="error-message"></span>
                            </div>
                                <span id="formaGreska" class="text-danger d-block mb-3"></span>
                            <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Dodaj nalog</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const greska = document.getElementById('formaGreska');
    greska.textContent = '';

    const podaci = Object.fromEntries(new FormData(e.target));

    try {
        const response = await fetch('/signupKuhinja', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(podaci)
        });

        const tekst = await response.text();
        let data = {};
        try { data = JSON.parse(tekst); } catch (_) { /* odgovor nije JSON, nije problem */ }

        if (response.ok && data.success !== false) {
            alert(data.message || 'Kuhinja je uspešno dodata.');
            window.location.replace('kuhinjeSef.html');
        } else {
            greska.textContent = data.message || 'Greška pri dodavanju (status ' + response.status + ').';
        }
    } catch (err) {
        console.error(err);
        greska.textContent = 'Greška u komunikaciji sa serverom.';
    }
});
</script>
</body>

</html>

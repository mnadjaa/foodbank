<!DOCTYPE html>
<html lang="sr">

<!--DONATORI SEF-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="sef" data-add-href="signupDonator.html" data-add-text="Dodaj donatora">
    <main>
        <!-- Chart Start -->
        <div class="container-fluid pt-4 px-4">
            <div class="row g-4">
                <!--donatori-->
                <h6 class="mb-3 mt-5 ">Donatori</h6>
                    <div class="table-responsive">
                        <table class="table table-bordered " id="donatoriInfo-table"style="width: fit-content;">
                            <thead>
                                <tr>
                                <!--<th scope="col">#</th>-->
                                <th scope="col">ID</th>
                                <th scope="col">Ime</th>
                                <th scope="col">Telefon</th>
                                <th scope="col">Mejl</th>
                                <th scope="col">Adresa</th>
                                </tr>
                            </thead>
                            <tbody id="donatoriInfo-body">
                            <!-- Podaci će biti dinamički ubačeni ovde -->
                            </tbody>
                        </table>
                    </div>
                    <!--donatori-->

                    <!-- brisanje donatora -->
                    <div class="container-fluid pt-4 px-4">
                        <h5 class="mb-3 text-center">Obriši donatora</h5>
                        <form action="/deleteDonator" method="POST">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="deleteUserId" name="userId" placeholder="User ID" required>
                                <label for="deleteUserId">ID donatora</label>
                            </div>
                            <button type="submit" class="btn btn-danger py-3 w-100">Obriši</button>
                        </form>
                    </div>
                    <!---->

            </div>
        </div>
        <!-- Chart End -->  
    </main>

    <script src="js/layout.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/donatoriInfo')
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.getElementById('donatoriInfo-body');
                    tableBody.innerHTML = ''; // da obrise redove koji postoje
                    data.forEach((row) => {
                        const tableRow = document.createElement('tr');
                        tableRow.innerHTML = `
                            <td>${row.DNTRID}</td>
                            <td>${row.Naziv||''}</td>
                            <td>${row.Telefon||''}</td>
                            <td>${row.Mejl||''}</td>
                            <td>${row.Adresa||''}</td>
                        `;
                        tableBody.appendChild(tableRow);
                    });
                })
                .catch(error => console.error('Error fetching donatori:', error));
        });
    </script>
</body>

</html>

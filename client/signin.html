<!DOCTYPE html>
<html lang="sr">

<!--PRIJAVI SE forma ZA SVE-->
<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-layout="auth">
    <main>
        <div class="container-fluid">
            <div class="row h-100 align-items-center justify-content-center" style="min-height: 100vh;">
                <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                    <div class="bg-light rounded p-4 p-sm-5 my-4 mx-3">
                        <div class="d-flex align-items-center justify-content-between mb-3">
                            <h3>Prijavi se</h3>
                        </div>
                        <form id="loginForm">
                            <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="emailuser" name="username" placeholder="user123">
                            <label for="emailuser">Korisničko ime</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="emailpassword" name="password" placeholder="Password">
                            <label for="emailpassword">Šifra</label>
                        </div>
                        <span id="loginGreska" class="text-danger d-block mb-3"></span>
                        <button type="submit" class="btn btn-primary py-3 w-100 mb-4">Prijavi se</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/layout.js"></script>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const greska = document.getElementById('loginGreska');
        greska.textContent = '';

        const username = document.getElementById('emailuser').value;
        const password = document.getElementById('emailpassword').value;

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirect;
            } else {
                greska.textContent = data.message;
            }
        } catch (err) {
            greska.textContent = 'Greška u komunikaciji sa serverom.';
        }
    });
    </script>

</body>
</html>

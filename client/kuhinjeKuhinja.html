<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="kuhinja">
    <main>
                    <!-- Kuhinje Start -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-12">
            <h6 class="mb-4">Kuhinje</h6>

            <div id="kuhinje-tabela"
                 data-endpoint="/kuhinjeK"
                 data-prikazi-id="false">
            </div>
        </div>
    </div>
</div>
                    <!-- Kuhinje End -->

                    <!--promena stanja-->

        <div class="input-group">
            <input type="text" class="form-control" id="novoStanjeInputId" pattern="\\d*" inputmode="numeric" min="0" placeholder="Broj obroka"></input>
            <button class="btn btn-primary" id="btnPromeniSt">Promenite stanje Vaše kuhinje</button>
        </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluKuhinje.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const novoStanje = document.getElementById('novoStanjeInputId');
        const button = document.getElementById('btnPromeniSt');

        button.addEventListener('click', function () {
            const novoStanjeValue = novoStanje.value.trim();

            if (novoStanjeValue === '' || isNaN(novoStanjeValue) || Number(novoStanjeValue) < 0) {
                alert('Unesite validan broj obroka koji nije negativan');
                return;
            }

            fetch('/izmeniKuhinju', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    novoStanje: Number(novoStanjeValue)
                })
            })
           .then(async response => {
    const tekst = await response.text();

    console.log("HTTP status:", response.status);
    console.log("Odgovor servera:", tekst);

    if (!response.ok) {
        throw new Error(tekst || 'Greška pri promeni stanja');
    }

    return JSON.parse(tekst);
})
            .then(data => {
                console.log('Promena stanja uspešno izvršena:', data);
                location.reload();
            })
            .catch(error => {
                console.error('Greška pri promeni stanja:', error);
                alert('Došlo je do greške pri promeni stanja kuhinje.');
            });
        });
    });
</script>

</body>

</html>

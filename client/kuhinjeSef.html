<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <title>NARODNA KUHINJA</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="js/head.js"></script>
</head>

<body data-role="sef" data-add-href="signupKuhinja.html" data-add-text="Dodaj kuhinju">
    <main>
        <div style=" margin-top: 60px;"></div>
        <h6 class="mb-2 text-center" >Kuhinje</h6><!--tabela:-->
        <div class="p-4">
            <div id="kuhinje-tabela"
                data-endpoint="/kuhinjeK"
                data-prikazi-id="true">
            </div>
        </div>
           <!--brisanje kuhinje-->
           <div style=" margin-top: 30px;"></div>
           <div class="container-fluid pt-4 px-4">

               <h6 class="mb-3 text-center">Obriši kuhinju</h6>
               <form id="forma-obrisi-kuhinju" action="/deleteKuhinja" method="POST">
                   <div class="form-floating mb-3">
                       <input type="text" class="form-control" id="deleteUserId" name="userId" placeholder="User ID" required>
                       <label for="deleteUserId">ID kuhinje</label>
                   </div>
                   <button type="submit" class="btn btn-danger py-3 w-100">Obriši</button>
                    <span id="poruka-obrisi" class="d-block mt-3 text-center"></span>
               </form>

           </div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/ucitajTabeluKuhinje.js"></script>
    <script src="js/brisanjeKuhinje.js"></script>

</body>
</html>
